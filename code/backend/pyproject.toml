[project]
name = "imodar"
version = "0.1.0"
description = "IMODAR API: audited text-to-SQL over clinical study data"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "duckdb>=1.1",
    "sqlglot>=25.0",
    "pandas>=2.2",
    "httpx>=0.27",
    "tabulate>=0.9",
    "qdrant-client>=1.10",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "argon2-cffi>=23",
    "pyotp>=2.9",
    "cryptography>=43",
    "segno>=1.6",
    "python-dotenv>=1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["imodar"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"imodar/planner.py" = ["F401", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
