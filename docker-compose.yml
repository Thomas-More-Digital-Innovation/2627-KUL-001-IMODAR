services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      # Local development only; the port is bound to localhost.
      POSTGRES_USER: imodar
      POSTGRES_PASSWORD: imodar
      POSTGRES_DB: imodar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imodar -d imodar"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - postgres:/var/lib/postgresql

  qdrant:
    # Host port 6335: the PoC already publishes 6333 and 6334.
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:6335:6333"
    volumes:
      - qdrant:/qdrant/storage

volumes:
  postgres:
  qdrant:
