# cp secrets.example.yaml secrets.yaml (git-ignored), fill in every <...>, then kubectl apply -f secrets.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: imodar
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: imodar
stringData:
  # openssl rand -hex 24 (hex, because it becomes part of a URL). Only read when the database is first created.
  POSTGRES_PASSWORD: "<POSTGRES_PASSWORD>"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend
  namespace: imodar
stringData:
  # just api secret-key. Back it up: losing it makes every enrolled authenticator unusable.
  APP_SECRET_KEY: "<APP_SECRET_KEY>"
  # Kept here rather than in a ConfigMap because internal hosts stay out of this public repository.
  OLLAMA_URL: "<http://ollama-host:11434>"
