apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  # One instance: migrations run on start and the warehouse volume is ReadWriteOnce.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      automountServiceAccountToken: false
      # Service variables such as QDRANT_PORT could collide with application settings.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # Only needed while the GHCR packages are private.
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        - name: migrate
          image: ghcr.io/thomas-more-digital-innovation/2627-kul-001-imodar/backend
          command: ["alembic", "upgrade", "head"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql+psycopg://imodar:$(POSTGRES_PASSWORD)@postgres:5432/imodar
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: backend
          image: ghcr.io/thomas-more-digital-innovation/2627-kul-001-imodar/backend
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: backend
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql+psycopg://imodar:$(POSTGRES_PASSWORD)@postgres:5432/imodar
            - name: QDRANT_URL
              value: http://qdrant:6333
            - name: IMODAR_WAREHOUSE
              value: /warehouse
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: warehouse
              mountPath: /warehouse
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: warehouse
          persistentVolumeClaim:
            claimName: warehouse
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: warehouse
  annotations:
    # Data outlives any change to this repository.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
