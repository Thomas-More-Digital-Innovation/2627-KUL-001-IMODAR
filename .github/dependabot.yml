version: 2
updates:
  # GitHub Actions (auto-bump pinned commit SHAs)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  # Frontend (npm dependencies)
  - package-ecosystem: "npm"
    directory: "/code/frontend"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      svelte:
        patterns:
          - "svelte*"
          - "@sveltejs/*"
      tooling:
        patterns:
          - "*eslint*"
          - "prettier*"
          - "typescript*"
          - "@playwright/*"
          - "vite*"
          - "globals"
          - "openapi-typescript"

  # Backend (uv dependencies)
  - package-ecosystem: "uv"
    directory: "/code/backend"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      tooling:
        patterns:
          - "pytest*"
          - "ruff*"

  # Docker Compose images
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker:
        patterns:
          - "*"
