name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "code/backend/**"
      - ".github/workflows/ci-backend.yml"
      - "!code/backend/**/*.md"
  pull_request:
    paths:
      - "code/backend/**"
      - ".github/workflows/ci-backend.yml"
      - "!code/backend/**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests & Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: imodar
          POSTGRES_PASSWORD: imodar
          POSTGRES_DB: imodar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U imodar -d imodar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://imodar:imodar@localhost:5432/imodar_test
    defaults:
      run:
        working-directory: code/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest
